# 99-kernel-lab.conf — track kernel Kali (OpenCode #2, M2 tuning runtime)
# Dibuat 2026-10-21 oleh track kernel-specialist. Rollback: hapus file ini + reboot
# (atau: sysctl -w <nilai> seperti di MEMORY-KERNEL.md §8)

# --- TCP: BBR + FQ (modul dimuat via /etc/modules-load.d/kernel-lab.conf) ---
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# --- Socket buffer: 4MB -> 16MB (latency jaringan tinggi / BDP besar) ---
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216

# --- VM: kurangi swap-thrash, pertahankan page cache ---
vm.swappiness = 10
vm.vfs_cache_pressure = 50
